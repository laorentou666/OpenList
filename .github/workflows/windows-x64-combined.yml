name: Build combined Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - build/windows-x64-combined

permissions:
  contents: read

concurrency:
  group: windows-x64-combined-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 with custom frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout frontend (feat-mkv-subtitles)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: laorentou666/OpenList-Frontend
          ref: feat-mkv-subtitles
          path: _frontend
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
          package_json_file: _frontend/package.json

      - name: Build frontend from source
        working-directory: _frontend
        run: |
          chmod +x build.sh
          ./build.sh --dev --skip-i18n --compress

      - name: Embed frontend into backend
        run: |
          rm -rf public/dist
          mkdir -p public/dist
          tar -xzf _frontend/dist/openlist-frontend-dist-*.tar.gz -C public/dist
          test -f public/dist/index.html
          frontend_version=$(cat _frontend/dist/VERSION)
          echo "FRONTEND_VERSION=${frontend_version}" >> "$GITHUB_ENV"
          echo "Frontend version: ${frontend_version}"

      - name: Test offline-download changes
        run: >-
          go test
          ./internal/offline_download/tool
          ./internal/offline_download/transmission
          ./internal/offline_download/halalcloud_open
          ./drivers/halalcloud_open

      - name: Build Windows x64 executable
        uses: OpenListTeam/cgo-actions@6fcace5934c36d70503dba06e2396bb58b766130 # v1.2.5
        with:
          targets: windows-amd64
          flags: -ldflags=
          github-token: ${{ secrets.GITHUB_TOKEN }}
          out-dir: build
          x-flags: |
            github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=laorentou666/OpenList combined build
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit
            github.com/OpenListTeam/OpenList/v4/internal/conf.Version=combined
            github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=${{ env.FRONTEND_VERSION }}
          output: openlist$ext

      - name: Verify executable
        run: test -s build/openlist.exe

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openlist-windows-x64-combined
          path: build/openlist.exe
          if-no-files-found: error
          retention-days: 14
